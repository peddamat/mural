; PlatformIO Project Configuration File
;
; Mural v2 supports:
;   - hw649_uno     : ATmega328P real-time motion controller for HW-649 + CNC Shield V3.0 + TMC2209
;   - hw649_esp8266 : ESP8266 WiFi, web server, kinematics & live browser-streaming controller
;   - esp32dev      : Original FluidNC ESP32 + TMC2209 + SD card controller
;
; See HW649_SETUP.md for wiring, DIP switch settings, and flashing instructions.

[platformio]
src_dir = .
default_envs = hw649_uno, hw649_esp8266

; ---------------------------------------------------------------------------
; HW-649 (ATmega328P side) + Arduino CNC Shield V3.0 + TMC2209 (Standalone)
; DIP Switches to flash: SW 3,4 ON (all others OFF)
; ---------------------------------------------------------------------------
[env:hw649_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 57600
build_src_filter = -<*> +<firmware/mural_uno/>
lib_deps =
	waspinator/AccelStepper@^1.64
	arduino-libraries/Servo@^1.2.1

; ---------------------------------------------------------------------------
; HW-649 (ESP8266 side - 32Mb / 4MB Flash)
; DIP Switches to flash: SW 5,6,7 ON (all others OFF)
; Upload web UI to LittleFS: pio run -e hw649_esp8266 -t uploadfs
; ---------------------------------------------------------------------------
[env:hw649_esp8266]
platform = espressif8266
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 57600
upload_speed = 460800
extra_scripts = pre:build.py
build_src_filter = -<*> +<firmware/mural_esp8266/>
lib_deps =
	https://github.com/tzapu/WiFiManager.git@2.0.17

; ---------------------------------------------------------------------------
; Original ESP32 FluidNC TMC2209 + SD Card Target
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
extra_scripts = build.py, merge_bin.py
framework = arduino
build_flags = -Isrc
build_src_filter = -<*> +<src/>
lib_deps =
	https://github.com/tzapu/WiFiManager.git@2.0.17
	https://github.com/ESP32Async/ESPAsyncWebServer.git@^3.7.4
	https://github.com/madhephaestus/ESP32Servo.git@^3.0.9
	https://github.com/adafruit/Adafruit_SSD1306.git@^2.5.13
	https://github.com/teemuatlut/tmcstepper.git@0.7.3+sha.74e8e68
	waspinator/AccelStepper@^1.64
	bblanchon/ArduinoJson@^5.13.4
