<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="940" height="380" rx="10" fill="#0b101b" />
  <rect width="940" height="380" rx="10" fill="url(#grid)" />

  <!-- ==================== POWER INPUTS (LEFT) ==================== -->
  <g>
    <!-- 12-20V Motor Power Supply -->
    <rect x="14" y="102" width="132" height="76" rx="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1.6" />
    <text x="80" y="121" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">12–20V DC Supply</text>
    <text x="80" y="136" fill="#cbd5e1" font-size="9.5" text-anchor="middle">USB-C PD Trigger</text>
    <text x="80" y="150" fill="#cbd5e1" font-size="9.5" text-anchor="middle">or 12V 3A PSU</text>
    <text x="80" y="167" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">Motors ONLY (not VIN!)</text>

    <!-- Power wires to CNC Shield blue terminal -->
    <path d="M 146 126 L 198 126" stroke="#ef4444" stroke-width="3" fill="none" />
    <path d="M 146 150 L 198 150" stroke="#64748b" stroke-width="3" fill="none" />
    <text x="172" y="121" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle">+ VMOT</text>
    <text x="172" y="162" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">− GND</text>

    <!-- 5V Logic Power callout -->
    <rect x="14" y="198" width="132" height="60" rx="7" fill="#1e293b" stroke="#eab308" stroke-width="1.4" stroke-dasharray="4 2" />
    <text x="80" y="216" fill="#fde047" font-size="10.5" font-weight="700" text-anchor="middle">5V Logic Power</text>
    <text x="80" y="231" fill="#cbd5e1" font-size="9" text-anchor="middle">HW-649 Micro-USB</text>
    <text x="80" y="245" fill="#cbd5e1" font-size="9" text-anchor="middle">(or 7–9V DC jack max)</text>
    <path d="M 146 228 L 186 228" stroke="#eab308" stroke-width="1.8" stroke-dasharray="3 2" fill="none" />
  </g>

  <!-- ==================== CNC SHIELD V3.0 PCB ==================== -->
  <g>
    <rect x="186" y="14" width="468" height="330" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
    <text x="420" y="33" fill="#fecaca" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">ARDUINO CNC SHIELD V3.0  (mounted on HW-649)</text>

    <!-- Reset button top-left -->
    <rect x="200" y="42" width="38" height="24" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <circle cx="219" cy="54" r="6" fill="#cbd5e1" />
    <text x="219" y="77" fill="#fecaca" font-size="8.5" text-anchor="middle">RESET</text>

    <!-- Blue Screw Terminal (12-36V) -->
    <rect x="196" y="108" width="34" height="58" rx="3" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="213" cy="126" r="6.5" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.2" />
    <line x1="209" y1="126" x2="217" y2="126" stroke="#cbd5e1" stroke-width="1.2" />
    <circle cx="213" cy="150" r="6.5" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.2" />
    <line x1="209" y1="150" x2="217" y2="150" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="238" y="129" fill="#fca5a5" font-size="9.5" font-weight="700">+</text>
    <text x="238" y="153" fill="#cbd5e1" font-size="9.5" font-weight="700">−</text>
    <text x="214" y="178" fill="#93c5fd" font-size="8.5" font-weight="700" text-anchor="middle">12–36V</text>

    <!-- Shared EN=D8 badge -->
    <rect x="197" y="252" width="54" height="58" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1" />
    <text x="224" y="268" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle">EN = D8</text>
    <text x="224" y="281" fill="#e2e8f0" font-size="8" text-anchor="middle">Active LOW</text>
    <text x="224" y="294" fill="#94a3b8" font-size="7.5" text-anchor="middle">A-Clone</text>
    <text x="224" y="304" fill="#94a3b8" font-size="7.5" text-anchor="middle">NO jumpers</text>
  </g>

  <!-- ==================== X-AXIS DRIVER (LEFT MOTOR) ==================== -->
  <g>
    <rect x="266" y="46" width="112" height="122" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
    <text x="322" y="61" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">X-AXIS (LEFT)</text>
    <text x="322" y="72" fill="#94a3b8" font-size="8.5" text-anchor="middle">STEP=D2 · DIR=D5</text>

    <!-- TMC2209 Module -->
    <rect x="278" y="78" width="88" height="82" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3" />
    <rect x="280" y="82" width="16" height="11" rx="2" fill="#22c55e" />
    <text x="288" y="90" fill="#052e16" font-size="7.5" font-weight="800" text-anchor="middle">EN</text>
    <text x="283" y="104" fill="#94a3b8" font-size="7">MS1</text>
    <text x="283" y="114" fill="#94a3b8" font-size="7">MS2</text>
    <text x="283" y="124" fill="#94a3b8" font-size="7">PDN</text>
    <text x="283" y="144" fill="#cbd5e1" font-size="7">STP</text>
    <text x="283" y="154" fill="#cbd5e1" font-size="7">DIR</text>

    <rect x="343" y="82" width="21" height="11" rx="2" fill="#ef4444" />
    <text x="353.5" y="90" fill="#ffffff" font-size="7" font-weight="800" text-anchor="middle">VM</text>
    <text x="348" y="103" fill="#94a3b8" font-size="7">GND</text>
    <text x="349" y="115" fill="#fbbf24" font-size="7">2B</text>
    <text x="349" y="125" fill="#fbbf24" font-size="7">2A</text>
    <text x="349" y="135" fill="#fbbf24" font-size="7">1A</text>
    <text x="349" y="145" fill="#fbbf24" font-size="7">1B</text>
    <text x="348" y="155" fill="#94a3b8" font-size="7">5V</text>

    <rect x="306" y="96" width="32" height="32" rx="3" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" />
    <text x="322" y="110" fill="#e0f2fe" font-size="8" font-weight="700" text-anchor="middle">TMC</text>
    <text x="322" y="121" fill="#e0f2fe" font-size="8" font-weight="700" text-anchor="middle">2209</text>
    <circle cx="322" cy="144" r="6.5" fill="#fbbf24" stroke="#78350f" stroke-width="1.2" />
    <line x1="318" y1="144" x2="326" y2="144" stroke="#78350f" stroke-width="1.2" />
    <text x="322" y="158" fill="#fde68a" font-size="7" font-weight="700" text-anchor="middle">0.9–1.0V</text>

    <!-- 4-pin X motor header -->
    <rect x="384" y="96" width="16" height="52" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1.3" />
    <circle cx="392" cy="106" r="2.5" fill="#fbbf24" />
    <circle cx="392" cy="117" r="2.5" fill="#fbbf24" />
    <circle cx="392" cy="128" r="2.5" fill="#fbbf24" />
    <circle cx="392" cy="139" r="2.5" fill="#fbbf24" />
    <text x="392" y="91" fill="#fde68a" font-size="8.5" font-weight="700" text-anchor="middle">X-MOT</text>

    <!-- MS1-MS3 Jumpers badge for X -->
    <rect x="279" y="170" width="86" height="20" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.2" />
    <text x="322" y="183" fill="#a7f3d0" font-size="8.5" font-weight="700" text-anchor="middle">MS1/2/3: ALL OFF</text>
  </g>

  <!-- ==================== Y-AXIS DRIVER (RIGHT MOTOR) ==================== -->
  <g>
    <rect x="266" y="196" width="112" height="118" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
    <text x="322" y="210" fill="#22d3ee" font-size="10.5" font-weight="700" text-anchor="middle">Y-AXIS (RIGHT)</text>
    <text x="322" y="221" fill="#94a3b8" font-size="8.5" text-anchor="middle">STEP=D3 · DIR=D6</text>

    <rect x="278" y="226" width="88" height="82" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3" />
    <rect x="280" y="230" width="16" height="11" rx="2" fill="#22c55e" />
    <text x="288" y="238" fill="#052e16" font-size="7.5" font-weight="800" text-anchor="middle">EN</text>
    <text x="283" y="252" fill="#94a3b8" font-size="7">MS1</text>
    <text x="283" y="262" fill="#94a3b8" font-size="7">MS2</text>
    <text x="283" y="272" fill="#94a3b8" font-size="7">PDN</text>
    <text x="283" y="292" fill="#cbd5e1" font-size="7">STP</text>
    <text x="283" y="302" fill="#cbd5e1" font-size="7">DIR</text>

    <rect x="343" y="230" width="21" height="11" rx="2" fill="#ef4444" />
    <text x="353.5" y="238" fill="#ffffff" font-size="7" font-weight="800" text-anchor="middle">VM</text>
    <text x="348" y="251" fill="#94a3b8" font-size="7">GND</text>
    <text x="349" y="263" fill="#fbbf24" font-size="7">2B</text>
    <text x="349" y="273" fill="#fbbf24" font-size="7">2A</text>
    <text x="349" y="283" fill="#fbbf24" font-size="7">1A</text>
    <text x="349" y="293" fill="#fbbf24" font-size="7">1B</text>
    <text x="348" y="303" fill="#94a3b8" font-size="7">5V</text>

    <rect x="306" y="244" width="32" height="32" rx="3" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" />
    <text x="322" y="258" fill="#e0f2fe" font-size="8" font-weight="700" text-anchor="middle">TMC</text>
    <text x="322" y="269" fill="#e0f2fe" font-size="8" font-weight="700" text-anchor="middle">2209</text>
    <circle cx="322" cy="292" r="6.5" fill="#fbbf24" stroke="#78350f" stroke-width="1.2" />
    <line x1="318" y1="292" x2="326" y2="292" stroke="#78350f" stroke-width="1.2" />
    <text x="322" y="306" fill="#fde68a" font-size="7" font-weight="700" text-anchor="middle">0.9–1.0V</text>

    <!-- 4-pin Y motor header -->
    <rect x="384" y="242" width="16" height="52" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1.3" />
    <circle cx="392" cy="252" r="2.5" fill="#fbbf24" />
    <circle cx="392" cy="263" r="2.5" fill="#fbbf24" />
    <circle cx="392" cy="274" r="2.5" fill="#fbbf24" />
    <circle cx="392" cy="285" r="2.5" fill="#fbbf24" />
    <text x="392" y="237" fill="#fde68a" font-size="8.5" font-weight="700" text-anchor="middle">Y-MOT</text>

    <!-- MS1-MS3 Jumpers badge for Y -->
    <rect x="279" y="317" width="86" height="20" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.2" />
    <text x="322" y="330" fill="#a7f3d0" font-size="8.5" font-weight="700" text-anchor="middle">MS1/2/3: ALL OFF</text>
  </g>

  <!-- ==================== Z & A SLOTS (EMPTY) ==================== -->
  <g opacity="0.65">
    <rect x="416" y="46" width="96" height="122" rx="6" fill="#450a0a" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 3" />
    <text x="464" y="100" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">Z-AXIS</text>
    <text x="464" y="115" fill="#fca5a5" font-size="9" text-anchor="middle">(Leave Empty)</text>

    <rect x="416" y="196" width="96" height="118" rx="6" fill="#450a0a" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 3" />
    <text x="464" y="250" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">A-AXIS</text>
    <text x="464" y="265" fill="#fca5a5" font-size="9" text-anchor="middle">(Leave Empty)</text>
  </g>

  <!-- ==================== RIGHT-EDGE HEADERS ON SHIELD ==================== -->
  <!-- Endstop / Servo Block -->
  <g>
    <rect x="526" y="46" width="116" height="122" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.8" />
    <text x="584" y="61" fill="#fdba74" font-size="9.5" font-weight="700" text-anchor="middle">ENDSTOPS &amp; 5V</text>

    <text x="536" y="78" fill="#64748b" font-size="8.5">X+ / X− (D9)</text>
    <text x="536" y="92" fill="#64748b" font-size="8.5">Y+ / Y− (D10)</text>

    <rect x="532" y="99" width="104" height="22" rx="4" fill="#7c2d12" stroke="#fb923c" stroke-width="1.3" />
    <text x="538" y="113" fill="#ffedd5" font-size="9" font-weight="700">Z+ (D11)</text>
    <circle cx="608" cy="110" r="3" fill="#94a3b8" />
    <circle cx="623" cy="110" r="3.4" fill="#f97316" />
    <text x="623" y="105" fill="#fdba74" font-size="6.5" font-weight="700" text-anchor="middle">SIG</text>

    <rect x="532" y="126" width="104" height="34" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="538" y="140" fill="#fca5a5" font-size="8.5" font-weight="700">5V Header</text>
    <circle cx="623" cy="137" r="3" fill="#ef4444" />
    <text x="538" y="154" fill="#cbd5e1" font-size="8.5" font-weight="700">GND Header</text>
    <circle cx="623" cy="151" r="3" fill="#94a3b8" />
  </g>

  <!-- I2C OLED Block -->
  <g>
    <rect x="526" y="196" width="116" height="118" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.8" />
    <text x="584" y="211" fill="#67e8f9" font-size="9.5" font-weight="700" text-anchor="middle">I²C / ANALOG PINS</text>

    <rect x="532" y="220" width="104" height="20" rx="3" fill="#164e63" stroke="#22d3ee" stroke-width="1" />
    <text x="538" y="233" fill="#cffafe" font-size="8.5" font-weight="700">SDA (A4)</text>
    <circle cx="623" cy="230" r="3" fill="#22d3ee" />

    <rect x="532" y="244" width="104" height="20" rx="3" fill="#164e63" stroke="#38bdf8" stroke-width="1" />
    <text x="538" y="257" fill="#e0f2fe" font-size="8.5" font-weight="700">SCL (A5)</text>
    <circle cx="623" cy="254" r="3" fill="#38bdf8" />

    <text x="538" y="280" fill="#fca5a5" font-size="8.5" font-weight="700">5V / 3.3V</text>
    <circle cx="623" cy="277" r="3" fill="#ef4444" />
    <text x="538" y="296" fill="#cbd5e1" font-size="8.5" font-weight="700">GND</text>
    <circle cx="623" cy="293" r="3" fill="#94a3b8" />
  </g>

  <!-- ==================== EXTERNAL PERIPHERALS (RIGHT) ==================== -->
  <!-- MG90S Servo -->
  <g>
    <path d="M 626 110 L 696 110 L 696 48 L 728 48" stroke="#f97316" stroke-width="2.2" fill="none" />
    <path d="M 626 137 L 704 137 L 704 62 L 728 62" stroke="#ef4444" stroke-width="2" fill="none" />
    <path d="M 626 151 L 712 151 L 712 76 L 728 76" stroke="#94a3b8" stroke-width="2" fill="none" />

    <rect x="728" y="18" width="198" height="72" rx="7" fill="#1e293b" stroke="#f97316" stroke-width="1.6" />
    <text x="827" y="36" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">MG90S Pen Servo</text>
    <text x="740" y="51" fill="#fb923c" font-size="9">● Orange (Signal) → Z+ (D11)</text>
    <text x="740" y="65" fill="#fca5a5" font-size="9">● Red (VCC) → 5V</text>
    <text x="740" y="79" fill="#cbd5e1" font-size="9">● Brown (GND) → GND</text>
  </g>

  <!-- 0.91" I2C OLED -->
  <g>
    <path d="M 626 230 L 690 230 L 690 136 L 728 136" stroke="#22d3ee" stroke-width="2" fill="none" />
    <path d="M 626 254 L 698 254 L 698 150 L 728 150" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 626 277 L 706 277 L 706 164 L 728 164" stroke="#ef4444" stroke-width="1.8" fill="none" />
    <path d="M 626 293 L 714 293 L 714 178 L 728 178" stroke="#94a3b8" stroke-width="1.8" fill="none" />

    <rect x="728" y="106" width="198" height="84" rx="7" fill="#1e293b" stroke="#06b6d4" stroke-width="1.6" />
    <text x="827" y="123" fill="#67e8f9" font-size="10.5" font-weight="700" text-anchor="middle">0.91" OLED (Optional)</text>
    <text x="740" y="138" fill="#67e8f9" font-size="9">● SDA → A4  (addr 0x3C)</text>
    <text x="740" y="152" fill="#7dd3fc" font-size="9">● SCL → A5</text>
    <text x="740" y="166" fill="#fca5a5" font-size="9">● VCC → 5V (or 3.3V)</text>
    <text x="740" y="180" fill="#cbd5e1" font-size="9">● GND → GND</text>
  </g>

  <!-- ==================== HW-649 8-WAY DIP SWITCH REFERENCE ==================== -->
  <g>
    <rect x="728" y="206" width="198" height="138" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="1.6" />
    <text x="827" y="224" fill="#d8b4fe" font-size="10.5" font-weight="700" text-anchor="middle">HW-649 DIP Switch (Under Shield)</text>

    <!-- Run mode visual (SW 1,2 ON) -->
    <text x="827" y="240" fill="#4ade80" font-size="9" font-weight="700" text-anchor="middle">RUN MODE: SW 1 &amp; 2 ON (3–8 OFF)</text>
    <g transform="translate(747, 247)">
      <rect x="0"   y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#4ade80" stroke-width="1.3" /><rect x="2.5" y="3"  width="11" height="11" rx="1.5" fill="#4ade80" /><text x="8"   y="41" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">1</text>
      <rect x="20"  y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#4ade80" stroke-width="1.3" /><rect x="22.5" y="3" width="11" height="11" rx="1.5" fill="#4ade80" /><text x="28"  y="41" fill="#f8fafc" font-size="8" font-weight="700" text-anchor="middle">2</text>
      <rect x="40"  y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"   /><rect x="42.5" y="16" width="11" height="11" rx="1.5" fill="#64748b" /><text x="48"  y="41" fill="#94a3b8" font-size="8" text-anchor="middle">3</text>
      <rect x="60"  y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"   /><rect x="62.5" y="16" width="11" height="11" rx="1.5" fill="#64748b" /><text x="68"  y="41" fill="#94a3b8" font-size="8" text-anchor="middle">4</text>
      <rect x="80"  y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"   /><rect x="82.5" y="16" width="11" height="11" rx="1.5" fill="#64748b" /><text x="88"  y="41" fill="#94a3b8" font-size="8" text-anchor="middle">5</text>
      <rect x="100" y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"   /><rect x="102.5" y="16" width="11" height="11" rx="1.5" fill="#64748b" /><text x="108" y="41" fill="#94a3b8" font-size="8" text-anchor="middle">6</text>
      <rect x="120" y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"   /><rect x="122.5" y="16" width="11" height="11" rx="1.5" fill="#64748b" /><text x="128" y="41" fill="#94a3b8" font-size="8" text-anchor="middle">7</text>
      <rect x="140" y="0" width="16" height="30" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1"   /><rect x="142.5" y="16" width="11" height="11" rx="1.5" fill="#64748b" /><text x="148" y="41" fill="#94a3b8" font-size="8" text-anchor="middle">8</text>
    </g>

    <line x1="740" y1="298" x2="914" y2="298" stroke="#334155" stroke-width="1" />
    <text x="740" y="313" fill="#38bdf8" font-size="8.8" font-weight="700">Flash Uno (ATmega328P):</text>
    <text x="914" y="313" fill="#e2e8f0" font-size="8.8" text-anchor="end">SW 3, 4 ON</text>
    <text x="740" y="328" fill="#fbbf24" font-size="8.8" font-weight="700">Flash ESP8266 + FS:</text>
    <text x="914" y="328" fill="#e2e8f0" font-size="8.8" text-anchor="end">SW 5, 6, 7 ON</text>
  </g>

  <!-- Footer Note -->
  <text x="470" y="366" fill="#94a3b8" font-size="9.5" text-anchor="middle">
    Always verify silkscreen labels (EN, VM, Z+, SDA/SCL) on your CNC Shield clone before applying power. Disconnect motors before tuning TMC2209 Vref.
  </text>
</svg>
